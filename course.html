<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ステーション地図">
<meta name="theme-color" content="#7b1fa2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ステーション地図</title>
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
  :root{--c:#4b2e83;--cl:rgba(75,46,131,.14);--cd:#2f1c54;--ct:#fff;--cx:#4b2e83}
  html,body{margin:0;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:#fff;-webkit-text-size-adjust:100%}
  #hd{position:absolute;top:0;left:0;right:0;z-index:1000;background:var(--c);color:var(--ct);padding:calc(env(safe-area-inset-top) + 7px) 14px 7px;min-height:31px;display:flex;align-items:center;gap:8px}
  #hd b{flex:1;min-width:0;text-align:center;font-size:13px;line-height:1.12;word-break:keep-all;overflow-wrap:anywhere}
  #hd #bHome .bl{display:none}
  #hd #bHome{padding:5px 12px}
  #hd button{background:#fff;color:var(--cx);border:0;border-radius:18px;padding:5px 14px;font-size:15px;font-weight:bold;white-space:nowrap}
  #menu{display:none;position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 52px);z-index:1070;background:#fff;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.4);padding:8px;min-width:210px}
  #menu.open{display:block}
  #menu .mh{font-size:12px;color:#777;padding:6px 8px 2px}
  #menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 10px;font-size:16px;border-radius:8px;color:#222}
  #menu button.sel{background:var(--cl);color:var(--cd);font-weight:bold}
  #map{position:absolute;top:0;bottom:0;left:0;right:0}
  .leaflet-top{margin-top:calc(env(safe-area-inset-top) + 50px)}
  .leaflet-container{background:#faeee0}   /* 地図の背景（薄い肌色） */
  .gray-tiles,.maplibregl-canvas{filter:grayscale(1) contrast(.9) brightness(1.08)}
  .maplibregl-canvas{position:absolute;left:0;top:0}
  .leaflet-maplibre-gl-container{pointer-events:none}
  .poi{position:relative;white-space:nowrap;line-height:18px}
  .poi .pi{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--c);box-sizing:border-box;font-size:10px;vertical-align:middle}
  .poi .pn{display:none;margin-left:4px;font-size:11px;font-weight:bold;color:var(--c);vertical-align:middle;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 3px #fff}
  .z-poi .poi .pn{display:inline}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--c);border:1px solid #fff;opacity:.6}
  .dot.done{background:#aaa;opacity:.5}
  .lbl.now{display:block}
  .pin{background:var(--c);color:var(--ct);border:2px solid #fff;border-radius:50%;width:28px;height:28px;line-height:24px;text-align:center;font-size:12px;font-weight:bold;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .pin.done{background:#bdbdbd;opacity:.7}
  .pin.sel{background:#e65100;transform:scale(1.35)}
  .z-small .pin{transform:scale(.72)}
  .z-small .pin.sel{transform:scale(1.1)}
  .lbl{display:none;background:none;border:0;box-shadow:none;color:#222;font-weight:bold;font-size:12px;padding:0;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff}
  .lbl:before{display:none}
  .z-label .lbl{display:block}
  .co{background:#263238;color:#fff;border:2px solid #fff;border-radius:6px;width:36px;height:22px;line-height:22px;text-align:center;font-size:12px;font-weight:bold;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .co.sel{background:#e65100;transform:scale(1.2)}
  .me{width:16px;height:16px;background:#1a73e8;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(26,115,232,.4)}
  #fab{position:absolute;right:12px;bottom:calc(var(--cardh,300px) + 14px);z-index:1000;display:flex;flex-direction:column;gap:10px}
  #fab button{width:48px;height:48px;border-radius:50%;border:0;background:#fff;color:var(--cx);font-size:11px;font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  #fab #bZin,#fab #bZout{font-size:26px;line-height:1;padding:0}
  #fab button.on{background:var(--c);color:var(--ct)}
  #card{position:absolute;left:0;right:0;bottom:0;z-index:1050;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.35);padding:8px 12px calc(env(safe-area-inset-bottom) + 6px)}
  #card .c1{display:flex;gap:10px;align-items:center}
  #card .n{background:#e65100;color:#fff;border-radius:10px;min-width:50px;height:40px;line-height:40px;text-align:center;font-size:18px;font-weight:bold;padding:0 6px}
  #card .t{flex:1;min-width:0;line-height:1.35}
  #card .mk{font-size:18px;font-weight:bold;color:#111;line-height:1.25;word-break:break-all}
  #card .st{font-size:14px;font-weight:bold;color:#222;margin-top:3px}
  #card .lg{font-size:14px;font-weight:bold;color:var(--cd);margin-top:3px}
  #card .c2{display:flex;flex-direction:column-reverse;gap:6px;margin-top:6px}   /* 縦一列：完了→次へ／曲がり方 */
  #card button,#card a.g{border:0;border-radius:10px;font-size:15px;padding:12px 10px;font-weight:bold;text-align:center;text-decoration:none}
  #card .c2 .steps{background:var(--cl);color:var(--cd);flex:1}
  #card .c2 .go{background:var(--c);color:var(--ct);font-size:24px;height:64px;padding:0}   /* 完了ボタンは大きく押しやすく */
  #card .c3{display:flex;flex-direction:column;gap:5px;margin-top:5px}      /* 縦一列：1つ戻る／Googleマップで案内 */
  #card .c2 button,#card .c3 button,#card .c3 a.g{flex:none;width:100%;box-sizing:border-box}
  #card .c3 button,#card .c3 a.g{padding:7px 10px;font-size:14px}
  #card .c3 .back{background:#eee;color:#333;flex:1;padding:8px}
  #card .c3 a.g{background:#eee;color:#333;flex:1;padding:8px}
  #rng{display:none;position:absolute;right:12px;bottom:calc(var(--cardh,300px) + 66px);z-index:1060;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.4);padding:10px 12px;font-size:14px;line-height:2}
  #rng input{width:56px;font-size:16px;padding:4px;border:1px solid #bbb;border-radius:6px;text-align:center}
  #rng button{border:0;border-radius:8px;padding:8px 12px;margin-right:6px;font-size:14px;font-weight:bold;background:var(--cl);color:var(--cd)}
  #rng #rShow{background:#1a237e;color:#fff}
  #steps{position:absolute;left:0;right:0;bottom:var(--cardh,300px);max-height:38%;overflow:auto;z-index:1040;background:#fff;box-shadow:0 -2px 8px rgba(0,0,0,.3);display:none;padding:6px 12px;font-size:15px}
  #steps.open{display:block}
  #steps div{padding:7px 0;border-bottom:1px solid #eee}
  #steps b{color:#e65100}
  #sheet{position:absolute;left:0;right:auto;bottom:0;top:calc(env(safe-area-inset-top) + 45px);width:min(88%,380px);z-index:1100;background:#fff;border-radius:0 14px 0 0;box-shadow:3px 0 14px rgba(0,0,0,.4);display:none;flex-direction:column;padding-left:env(safe-area-inset-left)}   /* 一覧は左から出す */
  #sheet.open{display:flex}
  #sheet .top{padding:10px 12px;display:flex;gap:8px;border-bottom:1px solid #ddd}
  #sheet input{flex:1;min-width:0;font-size:16px;padding:6px 8px;border:1px solid #bbb;border-radius:6px}
  #sheet .top button#bUndo{background:var(--cl);color:var(--cd);font-weight:bold}
  #sheet .top button{white-space:nowrap;border:0;background:#eee;border-radius:6px;padding:0 12px;font-size:14px}
  #list{overflow:auto;flex:1}
  .row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #eee;font-size:15px}
  .row.done .n,.row.done .tx{opacity:.45}
  .row .tx{flex:1;min-width:0}
  .row .ck{margin-left:auto;min-width:52px;height:42px;border-radius:10px;border:2px solid var(--c);background:#fff;color:var(--cx);font-size:20px;font-weight:bold;padding:0}
  .row.done .ck{background:var(--c);color:var(--ct)}
  .row .n{background:var(--c);color:var(--ct);border-radius:50%;min-width:28px;height:28px;line-height:28px;text-align:center;font-size:12px;font-weight:bold}
  .row small{color:#777}
  .pop a{display:inline-block;margin:4px 6px 0 0;padding:6px 10px;background:var(--c);color:var(--ct);border-radius:6px;text-decoration:none;font-size:13px}
  /* 横向き（パソコン・iPad・スマホ横向き）：左にカード、右に地図 */
  @media (orientation:landscape) and (min-width:640px){
    :root{--pw:clamp(300px,38%,420px);--hh:45px}
    #map{left:var(--pw)}
    #hd{padding:calc(env(safe-area-inset-top) + 7px) calc(env(safe-area-inset-right) + 14px) 7px calc(env(safe-area-inset-left) + 14px)}
    #hd b{font-size:16px}
    #hd #bHome .bl{display:inline}
    #menu{top:calc(env(safe-area-inset-top) + var(--hh) + 6px);right:calc(env(safe-area-inset-right) + 10px)}
    #hd button{padding:5px 16px;font-size:15px}
    .leaflet-top{margin-top:calc(env(safe-area-inset-top) + var(--hh) + 4px)}
    .leaflet-right{margin-right:env(safe-area-inset-right)}
    #card{left:0;right:auto;top:calc(env(safe-area-inset-top) + var(--hh));bottom:0;width:var(--pw);box-sizing:border-box;border-radius:0 14px 0 0;overflow:auto;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 12px)}
    #card .mk{font-size:19px}
    #card .c2 .go{height:68px;font-size:22px}
    /* ボタンを縦一列に（上から：完了→次へ、曲がり方、1つ戻る、Googleマップで案内） */
    #card .c2{flex-direction:column-reverse}
    #card .c3{flex-direction:column}
    #card .c2 button,#card .c3 button,#card .c3 a.g{flex:none;width:100%;box-sizing:border-box}
    #fab{right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 10px);flex-direction:row-reverse}
    #fab button{width:44px;height:44px;font-size:10px}
    #steps{left:var(--pw);right:auto;width:min(520px,calc(100% - var(--pw)));bottom:0;max-height:70%}
    #rng{right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 64px)}
    #sheet{left:0;width:var(--pw);top:calc(env(safe-area-inset-top) + var(--hh))}
    #toast{top:calc(env(safe-area-inset-top) + var(--hh) + 8px);left:calc(50% + 150px)}
  }
  .pop a.main{background:#e65100;font-weight:bold;font-size:14px}
  .pop a.sub{background:#777}
  #toast{display:none;position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 56px);z-index:1200;background:rgba(0,0,0,.8);color:#fff;padding:8px 14px;border-radius:16px;font-size:13px;max-width:80%;text-align:center}

  #card .gap{font-size:13px;font-weight:bold;color:#e65100;margin-top:3px}
  .mh2{padding:9px 12px;background:#fff3e0;color:#e65100;font-size:13px;font-weight:bold}
  .row.miss .n{background:#9e9e9e}
  .row.miss .tx{color:#666}
</style>
</head>
<body>
<div id="hd"><button id="bHome" aria-label="コース選択へ戻る">◀<span class="bl"> 戻る</span></button><button id="bList">一覧</button><b id="title">ステーション地図</b><button id="bMenu">メニュー</button></div>
<div id="menu"></div>
<div id="map"></div>
<div id="toast"></div>
<div id="fab"><button id="bZin" aria-label="拡大">＋</button><button id="bZout" aria-label="縮小">－</button><button id="bLoc">現在地</button><button id="bLine">順路</button><button id="bAll">全ピン</button></div>
<div id="rng"><b>順路を表示</b><br>№ <input id="rFrom" type="number" min="1" inputmode="numeric"> から № <input id="rTo" type="number" min="1" inputmode="numeric"> まで<br>
  <button id="rShow">表示</button><button id="rAll">全体</button><button id="rOff">消す</button></div>
<div id="steps"></div>
<div id="card"></div>
<div id="sheet"><div class="top"><input id="q" type="search" placeholder="番号・ST№・目標物で検索"><button id="bUndo">1つ戻る</button><button id="bClose">閉じる</button></div><div id="list"></div></div>

<script src="lib/leaflet.js"></script>
<script src="lib/maplibre-gl.js"></script>
<script src="lib/leaflet-maplibre-gl.js"></script>
<script src="simple-style.js"></script>
<script src="poi.js"></script>
<script src="base.js"></script>
<script>
// コースデータを、URLの ?c=コースID から読み込む（なければコース選択へ）
(function(){ var c = new URLSearchParams(location.search).get('c'); if (!c) { location.replace('index.html'); return; } document.write('<script src="data/' + encodeURIComponent(c) + '.js?t=' + Date.now() + '"><\/script>'); })();
</script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var cid = params.get('c');
  if (!COURSES[cid]) { location.replace('index.html'); return; }
  try { localStorage.setItem('gomi-map:last', cid); } catch(e) {}   // 次回、入口に「前回のコース」を出す
  var C = COURSES[cid], S = C.stations, LG = (typeof LEGS !== 'undefined' && LEGS[cid]) ? LEGS[cid] : null;
  // 目標物の半角カナ（ﾘﾌﾞﾘｰﾌｫﾚｽﾄ）は細く詰まって読みにくいので、全角（リブリーフォレスト）にそろえる
  S.forEach(function(s){ try { s.mark = String(s.mark || '').normalize('NFKC'); } catch(e) {} });
  var CP = [COMPANY.lat, COMPANY.lng];
  // コースの色（ヘッダー・ピン・ボタン）
  (function(){ var c = C.color, r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16), k = function(v){ return Math.round(v*0.6); }, st = document.documentElement.style;
    var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255, light = lum > 0.62;   // 黄色など明るい色は、文字を濃い色にする
    st.setProperty('--ct', light ? '#222' : '#fff'); st.setProperty('--cx', light ? 'rgb(' + k(r) + ',' + k(g) + ',' + k(b) + ')' : c);
    st.setProperty('--c', c); st.setProperty('--cl', 'rgba(' + r + ',' + g + ',' + b + ',.14)'); st.setProperty('--cd', 'rgb(' + k(r) + ',' + k(g) + ',' + k(b) + ')');
    document.title = C.name; var tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.content = c; })();

  // ---- 進み具合（その日の分をスマホに保存）----
  var d0 = new Date(), ymd = d0.getFullYear() + '-' + ('0'+(d0.getMonth()+1)).slice(-2) + '-' + ('0'+d0.getDate()).slice(-2);
  var KEY = 'gomi-map:' + cid + ':' + ymd, done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(done)); } catch(e) {} }
  function firstNotDone(){ for (var i = 0; i < S.length; i++) if (!done[S[i].no]) return i; return S.length; }
  var cur = firstNotDone();   // 次に向かう位置（0〜S.length。S.lengthは会社へ戻る）
  var prevIdx = cur - 1;      // 直前に完了した位置（-1は会社から）。cur-1 と違うときは「順番どおりでない移動」

  // ---- 地図 ----
  var map = L.map('map', {zoomControl:false, maxZoom:21}); window.gomiMap = map;
  var attr = '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>';
  var pale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {maxZoom:21, maxNativeZoom:18, attribution:attr, className:'gray-tiles'});
  // 記号・文字なしのシンプル地図（道路・川・水面・鉄道のみ）。使えない端末では「見やすい地図」に自動で切り替え
  var simple = null;
  try {
    if (typeof L.maplibreGL === 'function' && typeof SIMPLE_STYLE !== 'undefined') {
      var sty = JSON.parse(JSON.stringify(SIMPLE_STYLE));
      sty.layers = sty.layers.filter(function(l){ return l.type !== 'background'; });   // 背景は透明にして、下の肌色（.leaflet-container）を見せる
      simple = L.maplibreGL({style: sty, attribution: attr});
    }
  } catch(e) { simple = null; }
  (simple || pale).addTo(map);
  var std = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {maxZoom:21, maxNativeZoom:18, attribution:attr, className:'gray-tiles'});
  var photo = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {maxZoom:21, maxNativeZoom:18, attribution:attr});
  // 地図の種類は、右上の「メニュー」から切り替える
  var baseDefs = []; if (simple) baseDefs.push(['シンプル（記号なし）', simple]);
  baseDefs.push(['見やすい地図', pale], ['標準の地図', std], ['航空写真', photo]);
  var curBase = simple || pale;
  var menuEl = document.getElementById('menu');
  function renderMenu(){
    menuEl.innerHTML = '<div class="mh">地図の種類</div>' + baseDefs.map(function(d, i){ var on = d[1] === curBase; return '<button data-b="' + i + '" class="' + (on ? 'sel' : '') + '">' + (on ? '✓ ' : '') + d[0] + '</button>'; }).join('') +
      '<div class="mh">表示</div><button data-act="all" class="' + (showAll ? 'sel' : '') + '">' + (showAll ? '✓ ' : '') + '全ピンを番号つきで表示</button>' +
      '<div class="mh">ほか</div><button data-act="home">◀ コース選択へ戻る</button>';
  }
  document.getElementById('bMenu').onclick = function(e){ e.stopPropagation(); if (menuEl.classList.contains('open')) { menuEl.classList.remove('open'); } else { renderMenu(); menuEl.classList.add('open'); } };
  menuEl.onclick = function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.getAttribute('data-b') !== null) { var nb = baseDefs[+b.getAttribute('data-b')][1]; if (nb !== curBase) { map.removeLayer(curBase); nb.addTo(map); curBase = nb; } }
    else if (b.getAttribute('data-act') === 'all') { document.getElementById('bAll').click(); }
    else if (b.getAttribute('data-act') === 'home') { location.href = 'index.html'; return; }
    menuEl.classList.remove('open');
  };
  map.on('click', function(){ menuEl.classList.remove('open'); document.getElementById('sheet').classList.remove('open'); });
  // 拡大率に応じて、ピンを小さく／目標物の名前を表示
  var poiLayer = L.layerGroup();   // コンビニ・学校・お店などの目標物（拡大したときだけ表示）
  function zoomClass(){
    var z = map.getZoom(), c = map.getContainer().classList; c.toggle('z-small', z < 15); c.toggle('z-label', z >= 16); c.toggle('z-poi', z >= 16);
    if (z >= 15) { if (!map.hasLayer(poiLayer)) poiLayer.addTo(map); } else if (map.hasLayer(poiLayer)) map.removeLayer(poiLayer);
  }
  map.attributionControl.addAttribution('目標物 © OpenStreetMap contributors');
  map.on('zoomend', zoomClass);

  // 横向き（カードが右側）か縦向き（カードが下側）かで、地図を合わせるときの余白を変える
  function isLandscape(){ return window.innerWidth > window.innerHeight && window.innerWidth >= 640; }
  // 拡大率はそのままで、見えている範囲（バーとカードを除いた部分）の中央に、指定の場所が来るよう動かす
  function centerOn(ll){
    var z = map.getZoom(), H = window.innerHeight, hd = document.getElementById('hd').offsetHeight;
    var cardH = isLandscape() ? 0 : document.getElementById('card').offsetHeight;
    var offY = (hd + (H - cardH)) / 2 - H / 2;
    var p = map.project(L.latLng(ll[0], ll[1]), z).subtract([0, offY]);
    map.setView(map.unproject(p, z), z, {animate:true});
  }
  function padBR(){ return isLandscape() ? [30, 30] : [30, 350]; }   // 横向きは地図が右側の別領域なので、下に余白は不要
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtD(m){ return m >= 1000 ? (m/1000).toFixed(1) + 'km' : Math.round(m) + 'm'; }
  function toast(t, ms){ var d = document.getElementById('toast'); d.textContent = t; d.style.display = 'block';
    var lo = document.getElementById('sheet').classList.contains('open'); d.style.top = lo ? 'auto' : ''; d.style.bottom = lo ? '24px' : '';   // 一覧を開いているときは、ボタンに重ならないよう下に出す
    clearTimeout(toast.h); toast.h = setTimeout(function(){ d.style.display = 'none'; }, ms || 3500); }
  function gdir(a, b){ return 'https://www.google.com/maps/dir/?api=1&origin=' + a[0] + ',' + a[1] + '&destination=' + b[0] + ',' + b[1] + '&travelmode=driving'; }
  function pos(i){ return i < 0 ? CP : (i >= S.length ? CP : [S[i].lat, S[i].lng]); }

  var markers = {}, allLL = [];
  function pinIcon(no, cls){
    if (cls && cls.indexOf('dot') >= 0) return L.divIcon({className:'', html:'<div class="'+cls+'"></div>', iconSize:[12,12], iconAnchor:[6,6]});
    return L.divIcon({className:'', html:'<div class="pin'+(cls?' '+cls:'')+'">'+no+'</div>', iconSize:[28,28], iconAnchor:[14,14]});
  }
  var showAll = true;    // true: 全ピンを番号付きで表示（「全ピン」ボタンで、次の5件だけ番号付きにも切り替え可）
  S.forEach(function(s, idx){
    var p = [s.lat, s.lng]; allLL.push(p);
    var m = L.marker(p, {icon: pinIcon(s.no, '')}).addTo(map);
    var g = 'https://www.google.com/maps/search/?api=1&query=' + s.lat + ',' + s.lng;
    m.bindPopup('<div class="pop"><b>№' + s.no + '</b>　ST№' + s.st + '<br>地図: ' + s.map + '<br>' + esc(s.mark) +
      '<br><a class="main" href="#" data-idx="' + idx + '">ここを次にする</a><a class="sub" href="' + g + '" target="_blank">Googleマップで開く</a></div>');
    markers[idx] = m;
  });
  // 目標物（コンビニ・学校・お店など）
  var POI_STYLE = {cv:['🏪','#1e88e5'], sm:['🛒','#1e88e5'], sc:['🏫','#f9a825'], hp:['🏥','#e53935'], po:['📮','#e53935'], fu:['⛽','#6d4c41'], bk:['🏦','#546e7a'],
    fd:['🍴','#fb8c00'], dr:['💊','#43a047'], cc:['🏛','#7e57c2'], wp:['⛩','#8e24aa'], pk:['🌳','#43a047'], sh:['🛍','#1e88e5'], tr:['📷','#00897b'], of:['🏢','#546e7a']};
  if (typeof POIS !== 'undefined') POIS.forEach(function(p){
    var st = POI_STYLE[p.c] || ['•','#777'];
    L.marker([p.lat, p.lng], {icon:L.divIcon({className:'', html:'<div class="poi" style="--c:' + st[1] + '"><span class="pi">' + st[0] + '</span><span class="pn">' + esc(p.n) + '</span></div>', iconSize:[18,18], iconAnchor:[9,9]}), interactive:false, keyboard:false, zIndexOffset:-500}).addTo(poiLayer);
  });
  var cm = L.marker(CP, {icon:L.divIcon({className:'', html:'<div class="co" id="coIcon">会社</div>', iconSize:[40,26], iconAnchor:[20,13]}), zIndexOffset:1000}).addTo(map);
  cm.bindPopup('<div class="pop"><b>' + COMPANY.name + '</b><br>' + COMPANY.address + '<br><a class="main" href="#" data-idx="' + S.length + '">会社へ戻る</a></div>');
  map.fitBounds(allLL.concat([CP]), {padding:[40,40]});
  zoomClass();

  map.on('popupopen', function(e){
    var a = e.popup.getElement().querySelector('a[data-idx]');
    if (a) a.onclick = function(ev){ ev.preventDefault(); if (following) setFollow(false); cur = +a.getAttribute('data-idx'); map.closePopup(); render(true); };
  });

  // ---- 全体の順路（会社→№1〜№104→会社）----
  var R = null; if (LG) { var rl = [], rk = 0, rm = 0; LG.forEach(function(g){ rl = rl.concat(g.l); rk += g.km; rm += g.min; }); R = {line: rl, km: rk.toFixed(1), min: rm}; }
  var allLine = L.polyline(R ? R.line : allLL, {color:C.color, weight:4, opacity:.6});
  var bLine = document.getElementById('bLine'), rng = document.getElementById('rng');
  var rFrom = document.getElementById('rFrom'), rTo = document.getElementById('rTo'), rangeLine = null;
  bLine.onclick = function(){
    if (rng.style.display === 'block') { rng.style.display = 'none'; return; }
    rFrom.max = rTo.max = S.length;
    rFrom.value = Math.min(cur + 1, S.length - 1); rTo.value = Math.min(+rFrom.value + 4, S.length);
    rng.style.display = 'block';
  };
  function clearRange(){ if (rangeLine) { map.removeLayer(rangeLine); rangeLine = null; } if (map.hasLayer(allLine)) map.removeLayer(allLine); bLine.classList.remove('on'); }
  // №a〜№b の順路（区間データをつなぐ。№kから№k+1 は LG[k]）
  document.getElementById('rShow').onclick = function(){
    var a = Math.max(1, parseInt(rFrom.value, 10) || 1), b = Math.min(S.length, parseInt(rTo.value, 10) || S.length);
    if (!LG) { toast('区間データがありません'); return; }
    if (a >= b) { toast('終了は開始より大きい番号にしてください'); return; }
    clearRange();
    var pts = [], km = 0, mn = 0;
    for (var k = a; k <= b - 1; k++) { pts = pts.concat(LG[k].l); km += LG[k].km; mn += LG[k].min; }
    rangeLine = L.featureGroup([L.polyline(pts, {color:'#fff', weight:12, opacity:.95}), L.polyline(pts, {color:'#00897b', weight:7, opacity:1})]).addTo(map);
    bLine.classList.add('on');
    map.fitBounds(rangeLine.getBounds(), {paddingTopLeft:[30,110], paddingBottomRight:padBR(), maxZoom:17});
    toast('№' + a + '→№' + b + '　約' + km.toFixed(1) + 'km・走行のみ約' + mn + '分');
    rng.style.display = 'none';
  };
  document.getElementById('rAll').onclick = function(){
    clearRange(); allLine.addTo(map); bLine.classList.add('on'); rng.style.display = 'none';
    map.fitBounds(allLL.concat([CP]), {padding:[40,40]}); if (R) toast('全体（会社→№1〜№' + S.length + '→会社）約' + R.km + 'km');
  };
  document.getElementById('rOff').onclick = function(){ clearRange(); rng.style.display = 'none'; };

  // ---- 区間（前→次）の案内線 ----
  var legLine = null, lastPos = null, following = false, viewFixed = false;
  function render(fit){
    // ピンの色
    S.forEach(function(s, i){
      var focus = showAll || (i >= cur && i <= cur + 4);
      var cls = i === cur ? 'sel' : (done[s.no] ? (showAll ? 'done' : 'dot done') : (focus ? '' : 'dot'));
      markers[i].setIcon(pinIcon(s.no, cls));
      markers[i].setZIndexOffset(i === cur ? 800 : (focus ? 200 : 0));
      markers[i].unbindTooltip();
      // 目標物の名前：今向かう場所は常に表示、ほかのピンは拡大したとき（z-label）に表示
      if ((i === cur || focus) && s.mark) markers[i].bindTooltip(esc(s.mark), {permanent:true, direction:'right', offset:[16,0], className: i === cur ? 'lbl now' : 'lbl'});
    });
    var ci = document.getElementById('coIcon'); if (ci) ci.className = 'co' + (cur >= S.length ? ' sel' : '');
    var nDone = S.filter(function(s){ return done[s.no]; }).length;
    document.getElementById('title').textContent = C.name + '　' + nDone + '/' + S.length + '完了';

    // 案内線
    if (legLine) { map.removeLayer(legLine); legLine = null; }
    var seq = (prevIdx === cur - 1);                 // 順番どおりの移動か
    var leg = (LG && seq) ? LG[cur] : null;           // 順番どおりのときだけ道順データがある
    var from = pos(prevIdx), to = pos(cur);
    if (leg) legLine = L.featureGroup([L.polyline(leg.l, {color:'#fff', weight:13, opacity:.95}), L.polyline(leg.l, {color:'#2f3fe0', weight:8, opacity:1})]).addTo(map);
    else legLine = L.featureGroup([L.polyline([from, to], {color:'#2f3fe0', weight:5, dashArray:'8,8'})]).addTo(map);
    if (fit && !following) {
      if (!viewFixed) { var b = legLine.getBounds(); if (lastPos) b.extend(lastPos); map.fitBounds(b, {paddingTopLeft:[30,70], paddingBottomRight:padBR(), maxZoom:17}); viewFixed = true; }   // 最初の1回だけ区間全体に合わせる
      else centerOn(to);   // 以降は拡大率を変えず、次の目的地へ地図を動かす
    }

    // カード
    var s = cur < S.length ? S[cur] : null, fin = cur >= S.length;
    var prevName = prevIdx < 0 ? '会社' : '№' + S[prevIdx].no;
    var allDone = fin && S.length && done[S[S.length-1].no];
    var title = fin ? '会社' : '№' + s.no;
    var main = fin ? (COMPANY.address) : ('ST' + s.st + '　' + esc(s.mark));
    var sub = (fin ? '№' + S[S.length-1].no : prevName) + (fin ? '' : '') + 'から';
    var legInfo = leg ? ('　' + leg.km + 'km・約' + leg.min + '分') : ('　直線 約' + fmtD(hav(from, to)) + '（点線・道順なし）');
    var gHref = seq ? gdir(from, to) : ('https://www.google.com/maps/dir/?api=1&destination=' + to[0] + ',' + to[1] + '&travelmode=driving');
    // 前の場所と今の場所の間に、位置が未登録のステーション(№が飛ぶ)があれば、注意を出す
    var gapHtml = '';
    if (!fin && C.missing && C.missing.length) {
      var pn = prevIdx >= 0 && prevIdx < S.length ? S[prevIdx].no : 0;
      var gaps = C.missing.filter(function(m){ return m.no > pn && m.no < s.no; }).map(function(m){ return '№' + m.no; });
      if (gaps.length) gapHtml = '<div class="gap">⚠ ' + gaps.slice(0, 4).join('・') + (gaps.length > 4 ? ' ほか' + (gaps.length - 4) + '件' : '') + ' は位置未登録（一覧の最後で確認）</div>';
    }
    document.getElementById('card').innerHTML =
      '<div class="c1"><div class="n">' + title + '</div><div class="t">' +
      (fin ? '<div class="mk">会社へ戻ります</div><div class="st">' + esc(COMPANY.address) + '</div>'
           : '<div class="mk">' + (s.mark ? esc(s.mark) : '（目標物なし）') + '</div><div class="st">ST№ ' + esc(s.st) + '　／　地図 ' + esc(s.map) + '</div>') +
      '<div class="lg">' + prevName + 'から' + legInfo + '<span id="gd"></span></div>' + gapHtml + '</div></div>' +
      '<div class="c2"><button class="go" id="bDone">' + (fin ? '帰社しました' : '完了 → 次へ') + '</button></div>' +
      '<div class="c3"><button class="back" id="bBack">1つ戻る</button><a class="g" target="_blank" href="' + gHref + '">Googleマップで案内' + (seq ? '' : '（現在地から）') + '</a></div>';
    document.getElementById('bDone').onclick = onDone;
    document.getElementById('bBack').onclick = onBack;
    buildSteps(leg);
    updateDist();
    syncCard();
  }
  // カードの高さを、右下ボタンなどの位置に反映する
  function syncCard(){ var c = document.getElementById('card'); document.documentElement.style.setProperty('--cardh', c.offsetHeight + 'px'); }
  // 一覧のチェックから、好きな場所を完了／取り消しにする（順番を飛ばした場所の記録用）
  function toggleDone(i){
    var s = S[i], now = !done[s.no];
    if (now) done[s.no] = true; else delete done[s.no];
    save();
    var adv = false;
    if (now && i === cur) { var n = i + 1; while (n < S.length && done[S[n].no]) n++; prevIdx = n - 1; cur = n; adv = true; }   // 今向かう場所を完了にしたら、次へ進める
    if (adv && following) setFollow(false);   // 次へ進んだときは、一覧は開いたままにして、地図だけを次の場所へ動かす
    render(adv);
    var st = list.scrollTop; renderList(); list.scrollTop = st;
    toast('№' + s.no + (now ? ' を完了にしました' : ' の完了を取り消しました'));
  }
  function onDone(){
    if (cur < S.length) { done[S[cur].no] = true; save(); var n = cur + 1; while (n < S.length && done[S[n].no]) n++; prevIdx = n - 1; cur = n; render(true); }   // 完了済みの場所は飛ばす
    else { toast('お疲れさまでした。本日のコースは完了です'); }
  }
  function onBack(){
    if (cur <= 0) return;
    cur = cur - 1; if (cur < S.length) delete done[S[cur].no]; prevIdx = cur - 1; save(); render(true);
  }

  // ---- 曲がり方リスト ----
  var stepsEl = document.getElementById('steps');
  function buildSteps(leg){
    if (!leg || !leg.s) { stepsEl.innerHTML = '<div>この区間の案内データはありません</div>'; return; }
    stepsEl.innerHTML = leg.s.map(function(st, i){
      return '<div><b>' + (i+1) + '.</b> ' + esc(st.t) + (st.d > 0 ? '　→ ' + fmtD(st.d) + '進む' : '') + '</div>';
    }).join('');
  }
  function toggleSteps(){ stepsEl.classList.toggle('open'); }

  // ---- 現在地 ----
  var me = null, watching = false, bLoc = document.getElementById('bLoc');
  function hav(a, b){ var R2 = 6371000, r = Math.PI/180, dLa = (b[0]-a[0])*r, dLo = (b[1]-a[1])*r;
    var x = Math.sin(dLa/2)*Math.sin(dLa/2) + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)*Math.sin(dLo/2); return 2*R2*Math.asin(Math.sqrt(x)); }
  function updateDist(){ var el = document.getElementById('gd'); if (!el) return; el.textContent = lastPos ? '　／　現在地から約' + fmtD(hav(lastPos, pos(cur))) : ''; }
  // 自動追従：青い点に合わせて地図が動く。地図を指で動かすと一時停止し、「現在地」ボタンで再開
  function setFollow(on){ following = on; bLoc.classList.toggle('on', on); bLoc.textContent = on ? '追従中' : '現在地'; }
  map.on('dragstart', function(){ if (following) { setFollow(false); toast('追従を一時停止しました。「現在地」で再開します'); } });

  // 画面を消さない設定（Wake Lock）。対応していない端末では何もしない
  var wake = null;
  function keepAwake(){
    try {
      if (!('wakeLock' in navigator)) { return false; }
      navigator.wakeLock.request('screen').then(function(l){ wake = l; l.addEventListener('release', function(){ wake = null; }); }).catch(function(){});
      return true;
    } catch(e) { return false; }
  }
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && watching && !wake) keepAwake(); });

  bLoc.onclick = function(){
    if (!navigator.geolocation) { toast('この端末では現在地を取得できません'); return; }
    if (watching && me) { setFollow(true); map.setView(me.getLatLng(), Math.max(map.getZoom(), 16)); return; }
    navigator.geolocation.watchPosition(function(p){
      lastPos = [p.coords.latitude, p.coords.longitude];
      if (!me) {
        me = L.marker(lastPos, {icon:L.divIcon({className:'', html:'<div class="me"></div>', iconSize:[16,16], iconAnchor:[8,8]}), interactive:false}).addTo(map);
        map.setView(lastPos, 16); setFollow(true);
        if (!keepAwake()) toast('この端末では「画面を消さない設定」は使えません。画面を点けたままにしてください');
      } else {
        me.setLatLng(lastPos);
        if (following) map.panTo(lastPos, {animate:true, duration:0.5});
      }
      watching = true; updateDist();
    }, function(err){
      if (me) return;   // 追跡が始まったあとの一時的な途切れでは、案内を出さない
      var ua = navigator.userAgent, inApp = /Line\/|FBAN|FBAV|Instagram|GSA\/|Gmail|wv\)/i.test(ua);
      var msg;
      if (!window.isSecureContext) msg = 'HTTPSで開かれていないため、現在地を使えません';
      else if (err && err.code === 1) msg = inApp ? 'メール等のアプリ内ブラウザでは位置情報を使えません。SafariまたはChromeで開き直してください'
        : '位置情報が許可されていません。端末の設定で、このブラウザの位置情報を「許可」にしてください';
      else if (err && err.code === 2) msg = '位置を取得できません。端末の「位置情報サービス」がオンか、電波の状態をご確認ください';
      else if (err && err.code === 3) msg = '位置の取得に時間がかかっています。屋外で、もう一度お試しください';
      else msg = '現在地を取得できませんでした';
      toast(msg, 10000);
    }, {enableHighAccuracy:true, timeout:20000, maximumAge:5000});
  };
  document.getElementById('bZin').onclick = function(){ map.zoomIn(); };
  document.getElementById('bZout').onclick = function(){ map.zoomOut(); };
  var bAll = document.getElementById('bAll'); bAll.classList.toggle('on', showAll);
  bAll.onclick = function(){ showAll = !showAll; bAll.classList.toggle('on', showAll); render(false); toast(showAll ? '全ピンを番号つきで表示' : '次の5件だけ番号つきで表示'); };

  // ---- 一覧 ----
  var sheet = document.getElementById('sheet'), list = document.getElementById('list'), q = document.getElementById('q');
  function renderList(){
    var t = q.value.trim().toLowerCase();
    list.innerHTML = S.map(function(s, i){ return {s:s, i:i}; }).filter(function(o){ var s = o.s; return !t || (s.no+' '+s.st+' '+s.map+' '+s.mark).toLowerCase().indexOf(t) >= 0; }).map(function(o){
      var s = o.s; return '<div class="row' + (done[s.no] ? ' done' : '') + '" data-idx="' + o.i + '"><span class="n">' + s.no + '</span><div class="tx">ST' + s.st + '　' + esc(s.mark) + '<br><small>地図 ' + s.map + (done[s.no] ? '　✓完了' : '') + '</small></div><button class="ck" data-ck="' + o.i + '" aria-label="完了">✓</button></div>';
    }).join('') + missingRows(t);
  }
  // 地図にピンがないステーション（コース表にはあるが位置が未登録）。見落とし防止のため、一覧の最後に出す
  function missingRows(t){
    var ms = (C.missing || []).filter(function(m){ return !t || (m.no+' '+m.st+' '+m.map+' '+m.mark).toLowerCase().indexOf(t) >= 0; });
    if (!ms.length) return '';
    return '<div class="mh2">⚠ 位置が未登録のステーション ' + ms.length + '件（地図には出ません）</div>' + ms.map(function(m){
      return '<div class="row miss"><span class="n">' + m.no + '</span><div class="tx">ST' + m.st + '　' + esc(String(m.mark || '').normalize('NFKC')) + '<br><small>地図 ' + m.map + '　／　' + (m.why === 'ページ違い候補' ? 'ピンのページが違う可能性' : 'ピンなし') + '</small></div></div>';
    }).join('');
  }
  list.onclick = function(e){
    var ck = e.target.closest('.ck'); if (ck) { toggleDone(+ck.getAttribute('data-ck')); return; }   // チェック：その場所だけ完了／取り消し
    var row = e.target.closest('.row'); if (!row) return;
    var i = +row.dataset.idx; sheet.classList.remove('open'); if (following) setFollow(false); cur = i; render(true);   // タップした場所を次の目的地にする
  };
  q.oninput = renderList;
  // 戻る：そのコースの色の、日程の一覧へ（入口のページ）
  document.getElementById('bHome').onclick = function(){ location.href = 'index.html#g=' + encodeURIComponent(C.group); };
  document.getElementById('bList').onclick = function(){ renderList(); sheet.classList.add('open'); };
  document.getElementById('bClose').onclick = function(){ sheet.classList.remove('open'); };
  // 一覧の中でも「1つ戻る」（直前に進めた場所を、未完了に戻す）
  document.getElementById('bUndo').onclick = function(){
    if (cur <= 0) { toast('これ以上戻れません'); return; }
    if (following) setFollow(false);
    onBack();
    var st = list.scrollTop; renderList(); list.scrollTop = st;
    toast('№' + (cur < S.length ? S[cur].no : '') + ' を未完了に戻しました');
  };

  render(true);

  // 画面の実際の高さに合わせる（ホーム画面から起動したとき、下に白い余白が出るのを防ぐ）
  function fitScreen(){
    var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight) + 'px';
    document.documentElement.style.height = h; document.body.style.height = h;
    map.invalidateSize(); syncCard();
  }
  window.addEventListener('resize', fitScreen); window.addEventListener('orientationchange', function(){ setTimeout(fitScreen, 300); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fitScreen);
  fitScreen(); setTimeout(fitScreen, 500);

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
