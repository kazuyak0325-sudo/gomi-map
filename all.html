<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#37474f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>全ステーションマップ</title>
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f1ea}
  #hd{position:absolute;top:0;left:0;right:0;z-index:1000;background:#37474f;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:8px}
  #hd b{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hd button{background:#fff;color:#37474f;border:0;border-radius:18px;padding:7px 14px;font-size:15px;font-weight:bold;white-space:nowrap}
  #bar{position:absolute;top:calc(env(safe-area-inset-top) + 56px);left:0;right:0;z-index:999;background:rgba(255,255,255,.96);padding:8px 10px;display:flex;gap:7px;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  #bar input{flex:1;min-width:0;font-size:16px;padding:8px 10px;border:1px solid #90a4ae;border-radius:8px;background:#fff}
  #bar button{border:0;border-radius:8px;padding:9px 10px;font-size:13px;font-weight:bold;background:#fff3e0;color:#e65100;white-space:nowrap}
  #bar button#bAer{background:#eceff1;color:#37474f}
  #map{position:absolute;top:0;bottom:0;left:0;right:0}
  /* 色別ボタン（画面の右側） */
  #rail{position:absolute;right:8px;top:calc(env(safe-area-inset-top) + 124px);z-index:998;display:flex;flex-direction:column;gap:7px;max-height:calc(100% - env(safe-area-inset-top) - 230px);overflow-y:auto;padding:3px}
  #rail button{width:42px;height:42px;flex:none;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:bold;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.45);padding:0;line-height:1}
  #rail button.s{font-size:11px;letter-spacing:-.5px}
  #rail button.on{box-shadow:0 0 0 4px #e65100,0 2px 6px rgba(0,0,0,.45)}
  #rail button.off{opacity:.55}
  #toast{display:none;position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 120px);z-index:1200;background:rgba(0,0,0,.82);color:#fff;padding:9px 16px;border-radius:18px;font-size:13px;max-width:86%;text-align:center}
  #rail .sep{height:2px;background:#b0a99a;margin:1px 8px;flex:none;border-radius:1px}
  #sub{position:absolute;left:0;right:60px;top:calc(env(safe-area-inset-top) + 112px);z-index:998;display:none;gap:6px;overflow-x:auto;padding:7px 10px;white-space:nowrap}
  #sub button{flex:none;border:2px solid var(--g);background:#fff;color:#222;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:bold;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  #sub button.on{background:var(--g);color:var(--gt)}
  /* コースの地図と同じ見た目：薄い肌色の背景に、白黒の道路 */
  .leaflet-container{background:#faeee0}
  .gray-tiles,.maplibregl-canvas{filter:grayscale(1) contrast(.9) brightness(1.08)}
  .maplibregl-canvas{position:absolute;left:0;top:0}
  .leaflet-maplibre-gl-container{pointer-events:none}
  .sp{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-weight:bold;line-height:1;letter-spacing:-.3px}
  .sp.add{box-shadow:0 0 0 3px #2e7d32,0 1px 4px rgba(0,0,0,.5)}
  .z-small .sp{transform:scale(.62)}
  .lbl{display:none;background:none;border:0;box-shadow:none;color:#222;font-weight:bold;font-size:12px;padding:0;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff}
  .lbl:before{display:none}
  .z-label .lbl{display:block}
  .poi{position:relative;white-space:nowrap;line-height:18px}
  .poi .pi{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--c);box-sizing:border-box;font-size:10px;vertical-align:middle}
  .poi .pn{display:none;margin-left:4px;font-size:11px;font-weight:bold;color:var(--c);vertical-align:middle;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 3px #fff}
  .z-poi .poi .pn{display:inline}
  .pnl{position:absolute;z-index:1100;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 108px);background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.4);display:none;flex-direction:column}
  .pnl.open{display:flex}
  .pnl .top{padding:10px 14px;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:8px}
  .pnl .top b{flex:1;font-size:15px}
  .pnl .top button{border:0;background:#eee;border-radius:8px;padding:8px 14px;font-size:14px}
  .pnl p{margin:0;padding:8px 14px;font-size:12px;color:#666;background:#faf6ee}
  #plist,#slist{flex:1;overflow:auto}
  .r{padding:10px 14px;border-bottom:1px solid #eee}
  .r.tap{cursor:pointer}
  .r.tap:active{background:#e3f2fd}
  .r .h{font-weight:bold;font-size:16px}
  .r .m{color:#444;font-size:14px;margin-top:2px}
  .tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;background:#fff3e0;color:#e65100;font-size:11px;font-weight:bold}
  .chip{display:inline-block;margin:4px 4px 0 0;padding:2px 8px;border-radius:10px;font-size:11px;color:#fff;white-space:nowrap}
  .pp .chip{margin-top:3px}
  .adm{display:none;margin-top:8px;padding:6px 12px;border:2px solid #37474f;border-radius:8px;color:#37474f;font-size:13px;font-weight:bold;text-decoration:none}
  @media (min-width:900px){ .adm{display:inline-block} }
</style>
</head>
<body>
<div id="hd"><button id="back">◀ 戻る</button><b>全ステーションマップ</b></div>
<div id="bar"><input id="sq" type="search" placeholder="🔍 ステーション検索" autocomplete="off"><button id="bAer">写真</button><button id="bMiss">⚠ 位置なし <span id="nm">0</span></button></div>
<div id="sub"></div>
<div id="toast"></div>
<div id="rail"></div>
<div id="map"></div>
<div class="pnl" id="panel"><div class="top"><b id="ph" style="color:#e65100"></b><button id="pclose">閉じる</button></div><p>ピンの追加・修正は、事務所PCの管理ツールで行います。追加すると、すべてのコースに反映されます。</p><div id="plist"></div></div>
<div class="pnl" id="spanel"><div class="top"><b id="sh">検索結果</b><button id="sclose">閉じる</button></div><div id="slist"></div></div>
<script src="lib/leaflet.js"></script>
<script src="lib/maplibre-gl.js"></script>
<script src="lib/leaflet-maplibre-gl.js"></script>
<script src="simple-style.js"></script>
<script src="poi.js"></script>
<script>document.write('<script src="all.js?t=' + Date.now() + '"><\/script>');</script>
<script>
(function(){
  if (typeof ALL === 'undefined') { location.replace('index.html'); return; }
  var CB = {}; ALL.courses.forEach(function(c){ CB[c.id] = c; });
  function $(id){ return document.getElementById(id); }
  function toast(t){ var d = $('toast'); d.textContent = t; d.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function(){ d.style.display = 'none'; }, 3000); }
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function norm(t){ try { return String(t || '').normalize('NFKC'); } catch(e) { return t || ''; } }
  function isLight(c){ var r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16); return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.62; }
  function chips(ids){ return ids.map(function(id){ var c = CB[id]; return '<span class="chip" style="background:' + c.color + ';color:' + (isLight(c.color) ? '#222' : '#fff') + '">' + esc(c.group.replace('容プラ', '容') + ' ' + c.sched.replace('ペット・ダンボール', 'ペット')) + '</span>'; }).join(''); }

  // ---- 地図（コースの地図と同じ：国土地理院ベクトルタイルの、記号なしの白黒の道路）----
  var map = L.map('map', {zoomControl:false, maxZoom:21}); window.allMap = map;
  var attr = '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>';
  var pale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {maxZoom:21, maxNativeZoom:18, attribution:attr, className:'gray-tiles'});
  var photo = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {maxZoom:21, maxNativeZoom:18, attribution:attr});
  var simple = null;
  try {
    if (typeof L.maplibreGL === 'function' && typeof SIMPLE_STYLE !== 'undefined') {
      var sty = JSON.parse(JSON.stringify(SIMPLE_STYLE)); sty.layers = sty.layers.filter(function(l){ return l.type !== 'background'; });
      simple = L.maplibreGL({style: sty, attribution: attr});
    }
  } catch(e) { simple = null; }
  var curBase = simple || pale; curBase.addTo(map);
  var aerial = false, bAer = $('bAer');
  bAer.onclick = function(){ map.removeLayer(aerial ? photo : curBase); (aerial ? curBase : photo).addTo(map); aerial = !aerial; bAer.textContent = aerial ? '地図' : '写真'; };
  L.control.zoom({position:'bottomright'}).addTo(map);

  // ---- 色別の絞り込み（画面の右側のボタン）----
  var fg = '', fcid = '', fs = '';   // fg: 色(グループ)  fcid: その中の日程(コース)  fs: 「全」のときの日程(月・木 など。色をまたぐ)
  var SCHEDS = [['', 'すべて'], ['getsu', '月・木'], ['ka', '火・金'], ['pet13', 'ペット第1/第3'], ['pet24', 'ペット第2/第4']];
  function schedKey(c){ var s = c.sched; if (s.indexOf('月・木') >= 0) return 'getsu'; if (s.indexOf('火・金') >= 0) return 'ka'; if (s.indexOf('ペット') >= 0) return (/第2\/第4|②/.test(s)) ? 'pet24' : 'pet13'; return 'chiku'; }
  var GROUPS = [], availG = {}; ALL.courses.forEach(function(c){ if (GROUPS.indexOf(c.group) < 0) GROUPS.push(c.group); if (c.avail) availG[c.group] = true; });
  var gColor = {}; ALL.courses.forEach(function(c){ if (!gColor[c.group]) gColor[c.group] = c.color; });
  function active(){ return !!(fg || fcid || fs); }
  function inCourse(o){ if (fcid) return o.c.indexOf(fcid) >= 0; if (fg) return o.c.some(function(id){ return CB[id].group === fg; }); if (fs) return o.c.some(function(id){ return schedKey(CB[id]) === fs; }); return true; }
  function courseOf(p){ if (fcid && p.c.indexOf(fcid) >= 0) return CB[fcid]; if (fg) { var m = p.c.filter(function(id){ return CB[id].group === fg; })[0]; if (m) return CB[m]; } else if (fs) { var m2 = p.c.filter(function(id){ return schedKey(CB[id]) === fs; })[0]; if (m2) return CB[m2]; } return CB[p.c[0]]; }
  function shortName(g){ return g.indexOf('容プラ') === 0 ? '容' + g.replace('容プラ(', '').replace(')', '') : (g === 'ピンク' ? 'ピ' : g); }
  function buildRail(){
    var html = '<button class="all' + (!fg ? ' on' : '') + '" data-g="" style="background:#37474f">全</button><div class="sep"></div>';
    GROUPS.forEach(function(g, i){
      if (g.indexOf('容プラ') === 0 && (i === 0 || GROUPS[i - 1].indexOf('容プラ') !== 0)) html += '<div class="sep"></div>';
      var col = gColor[g], off = !availG[g]; html += '<button class="' + (g.indexOf('容プラ') === 0 ? 's' : '') + (fg === g ? ' on' : '') + (off ? ' off' : '') + '" data-g="' + esc(g) + '" style="background:' + (off ? '#b0a99a' : col) + ';color:' + (off ? '#fff' : (isLight(col) ? '#222' : '#fff')) + '">' + esc(shortName(g)) + '</button>';
    });
    $('rail').innerHTML = html;
  }
  function buildSub(){
    var el = $('sub');
    if (!fg) {   // 「全」のとき：色をまたいで、日程で切り替える
      el.style.cssText = 'display:flex;--g:#37474f;--gt:#fff';
      el.innerHTML = SCHEDS.map(function(s){ return '<button class="' + (fs === s[0] ? 'on' : '') + '" data-s="' + s[0] + '">' + esc(s[1]) + '</button>'; }).join('');
      return;
    }
    var col = gColor[fg]; el.style.cssText = 'display:flex;--g:' + col + ';--gt:' + (isLight(col) ? '#222' : '#fff');
    el.innerHTML = '<button class="' + (!fcid ? 'on' : '') + '" data-c="">すべて</button>' + ALL.courses.filter(function(c){ return c.avail && c.group === fg; }).map(function(c){ return '<button class="' + (fcid === c.id ? 'on' : '') + '" data-c="' + esc(c.id) + '">' + esc(c.sched.replace('ペット・ダンボール', 'ペット')) + '</button>'; }).join('');
  }
  $('rail').onclick = function(e){ var b = e.target.closest('button'); if (!b) return; if (b.classList.contains('off')) { toast(b.getAttribute('data-g') + 'は、マイマップのピン待ちです（準備中）'); return; } fg = b.getAttribute('data-g'); fcid = ''; applyFilter(); };
  $('sub').onclick = function(e){ var b = e.target.closest('button'); if (!b) return; if (b.hasAttribute('data-s')) { fs = b.getAttribute('data-s'); } else { fcid = b.getAttribute('data-c'); } applyFilter(); };

  // ---- 目標物（コンビニ・学校・お店など）：色を選んだときだけ、拡大したときに表示 ----
  var poiLayer = L.layerGroup();
  var POI_STYLE = {cv:['🏪','#1e88e5'], sm:['🛒','#1e88e5'], sc:['🏫','#f9a825'], hp:['🏥','#e53935'], po:['📮','#e53935'], fu:['⛽','#6d4c41'], bk:['🏦','#546e7a'],
    fd:['🍴','#fb8c00'], dr:['💊','#43a047'], cc:['🏛','#7e57c2'], wp:['⛩','#8e24aa'], pk:['🌳','#43a047'], sh:['🛍','#1e88e5'], tr:['📷','#00897b'], of:['🏢','#546e7a']};
  if (typeof POIS !== 'undefined') POIS.forEach(function(p){
    var st = POI_STYLE[p.c] || ['•','#777'];
    L.marker([p.lat, p.lng], {icon:L.divIcon({className:'', html:'<div class="poi" style="--c:' + st[1] + '"><span class="pi">' + st[0] + '</span><span class="pn">' + esc(p.n) + '</span></div>', iconSize:[18,18], iconAnchor:[9,9]}), interactive:false, keyboard:false, zIndexOffset:-500}).addTo(poiLayer);
  });
  function zoomClass(){
    var z = map.getZoom(), c = map.getContainer().classList; c.toggle('z-small', z < 15); c.toggle('z-label', z >= 16); c.toggle('z-poi', z >= 16);
    if (z >= 15 && active()) { if (!map.hasLayer(poiLayer)) poiLayer.addTo(map); } else if (map.hasLayer(poiLayer)) map.removeLayer(poiLayer);
  }
  map.on('zoomend', zoomClass);

  // ---- ステーションのピン ----
  // 軽くするため：引いたとき、または色を選んでいないときは、軽い丸だけ。色を選んで拡大したときは、見える範囲のピンだけを、番号・名前つきで描く
  var layer = L.layerGroup().addTo(map), cur = [], canvas = L.canvas({padding:.5});
  function popupHtml(p){ return '<div class="pp"><b>ST' + esc(p.st) + '</b>　地図 ' + esc(p.map) + '<br>' + esc(norm(p.mark)) + '<br>' + chips(p.c) + '</div>'; }
  function build(){
    layer.clearLayers(); var z = map.getZoom();
    if (z < 15 || !active()) {
      cur.forEach(function(p){
        L.circleMarker([p.lat, p.lng], {renderer:canvas, radius:z < 13 ? 3 : (z < 15 ? 5 : 8), color:p.a ? '#2e7d32' : '#fff', weight:p.a ? 3 : 1.5, fillColor:courseOf(p).color, fillOpacity:.95}).bindPopup(popupHtml(p)).addTo(layer);
      });
    } else {
      var bd = map.getBounds().pad(0.3), n = 0;
      for (var i = 0; i < cur.length && n < 500; i++) {
        var p = cur[i]; if (!bd.contains([p.lat, p.lng])) continue; n++;
        var c = courseOf(p), fs = String(p.st).length >= 4 ? 8 : 10;
        var m = L.marker([p.lat, p.lng], {icon:L.divIcon({className:'', html:'<div class="sp' + (p.a ? ' add' : '') + '" style="background:' + c.color + ';color:' + (isLight(c.color) ? '#222' : '#fff') + ';font-size:' + fs + 'px">' + esc(p.st) + '</div>', iconSize:[26,26], iconAnchor:[13,13]})}).addTo(layer);
        m.bindPopup(popupHtml(p));
        if (p.mark) m.bindTooltip(esc(norm(p.mark)), {permanent:true, direction:'right', offset:[16,0], className:'lbl'});
      }
    }
  }
  map.on('moveend', build);
  function draw(){ cur = ALL.pins.filter(inCourse); $('nm').textContent = ALL.missing.filter(inCourse).length; build(); return cur.map(function(p){ return [p.lat, p.lng]; }); }
  function applyFilter(){ buildRail(); buildSub(); var p = draw(); if (p.length) map.fitBounds(L.latLngBounds(p).pad(0.1)); zoomClass(); clearHl(); }
  map.setView([36.87, 140.06], 12);   // 描く前に、まず表示位置を決める（決める前だと、地図の範囲が取れずにエラーになる）
  buildRail(); buildSub(); var pts = draw(); if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.05));
  zoomClass();

  // ---- ステーション検索（上のバーの入力欄。ST№・目標物・地図ページ。位置のないステーションも出す）----
  var spanel = $('spanel'), sq = $('sq'), slist = $('slist'), hl = null, sres = [];
  var INDEX = ALL.pins.map(function(p){ return {p:p, pin:true, t:norm(p.st + ' ' + p.map + ' ' + p.mark).toLowerCase()}; })
    .concat(ALL.missing.map(function(m){ return {p:m, pin:false, t:norm(m.st + ' ' + m.map + ' ' + m.mark).toLowerCase()}; }));
  function clearHl(){ if (hl) { map.removeLayer(hl); hl = null; } }
  function openS(){ $('panel').classList.remove('open'); spanel.classList.add('open'); }
  function doSearch(){
    var q = norm(sq.value).toLowerCase().trim();
    if (!q) { sres = []; $('sh').textContent = 'ステーション検索'; slist.innerHTML = '<div class="r" style="color:#666;font-size:14px;line-height:1.7">ST№（例：782）、目標物（例：公民館）、地図ページ（例：69-B）で探せます。<br>言葉を空白で区切ると、絞り込めます（例：公民館 69）。</div>'; return; }
    var toks = q.split(/\s+/);
    var res = INDEX.filter(function(x){ return toks.every(function(t){ return x.t.indexOf(t) >= 0; }); });
    res.sort(function(a, b){ var ea = a.p.st === q ? 0 : 1, eb = b.p.st === q ? 0 : 1; return ea - eb || (b.pin - a.pin) || (+a.p.st) - (+b.p.st); });
    var total = res.length; sres = res.slice(0, 60);
    $('sh').textContent = total ? '検索結果 ' + total + '件' + (total > 60 ? '（先頭の60件）' : '') : '見つかりません';
    slist.innerHTML = sres.map(function(x, i){
      var p = x.p;
      return '<div class="r' + (x.pin ? ' tap' : '') + '" data-i="' + i + '"><div class="h">ST' + esc(p.st) + '　<span style="font-weight:normal;color:#555">地図 ' + esc(p.map) + '</span>' + (x.pin ? '' : '<span class="tag">位置なし</span>') + '</div><div class="m">' + esc(norm(p.mark)) + '</div><div>' + chips(p.c) + '</div>' + (x.pin ? '' : '<a class="adm" target="_blank" href="http://127.0.0.1:8790/#k=' + encodeURIComponent(p.k) + '">📌 管理ツールでピンを置く</a>') + '</div>';
    }).join('');
  }
  sq.oninput = function(){ openS(); doSearch(); };
  sq.onfocus = function(){ openS(); doSearch(); };
  slist.onclick = function(e){
    var r = e.target.closest('.tap'); if (!r) return; var x = sres[+r.getAttribute('data-i')]; if (!x || !x.pin) return; var p = x.p;
    spanel.classList.remove('open'); sq.blur(); clearHl();
    hl = L.circleMarker([p.lat, p.lng], {radius:16, color:'#e65100', weight:4, fillColor:'#fff', fillOpacity:.25}).addTo(map).bindPopup(popupHtml(p));
    map.setView([p.lat, p.lng], Math.max(map.getZoom(), 17)); hl.openPopup();
  };
  $('sclose').onclick = function(){ spanel.classList.remove('open'); sq.blur(); };

  // ---- 位置のないステーションの一覧 ----
  var panel = $('panel');
  function renderMiss(){
    var miss = ALL.missing.filter(inCourse).sort(function(a, b){ return b.c.length - a.c.length || (+a.st) - (+b.st); });
    $('ph').textContent = '⚠ 位置のないステーション ' + miss.length + '種類（地図には出ません）';
    $('plist').innerHTML = miss.length ? miss.map(function(m){ return '<div class="r"><div class="h">ST' + esc(m.st) + '　<span style="font-weight:normal;color:#555">地図 ' + esc(m.map) + '</span></div><div class="m">' + esc(norm(m.mark)) + '</div><div>' + chips(m.c) + '</div><a class="adm" target="_blank" href="http://127.0.0.1:8790/#k=' + encodeURIComponent(m.k) + '">📌 管理ツールでピンを置く</a></div>'; }).join('') : '<div class="r" style="color:#2e7d32;font-weight:bold">位置のないステーションは、ありません</div>';
  }
  $('bMiss').onclick = function(){ spanel.classList.remove('open'); sq.blur(); renderMiss(); panel.classList.add('open'); };
  $('pclose').onclick = function(){ panel.classList.remove('open'); };
  $('back').onclick = function(){ location.href = 'index.html'; };
  map.on('click', function(){ panel.classList.remove('open'); spanel.classList.remove('open'); sq.blur(); clearHl(); });
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
