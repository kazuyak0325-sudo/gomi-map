<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ごみ収集ナビ">
<meta name="theme-color" content="#37474f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ごみ収集ナビ</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f1ea;color:#222;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:5;background:#37474f;color:#fff;padding:calc(env(safe-area-inset-top) + 7px) 14px 7px;min-height:calc(env(safe-area-inset-top) + 52px);display:flex;align-items:center;gap:10px}
  header b{flex:1;font-size:17px}
  header button{background:#fff;color:#37474f;border:0;border-radius:18px;padding:7px 14px;font-size:15px;font-weight:bold}
  main{padding:16px 16px calc(env(safe-area-inset-bottom) + 28px);max-width:640px;margin:0 auto}
  h2{font-size:14px;color:#666;margin:22px 4px 8px}
  .allmap{display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:16px;margin-bottom:12px;background:#37474f;color:#fff;font-size:19px;font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .allmap small{display:block;font-weight:normal;font-size:12px;margin-top:5px;opacity:.9}
  .last{display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:16px;margin-bottom:4px}
  .last small{display:block;color:#666;font-size:12px;margin-bottom:3px}
  .last b{font-size:19px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{border:0;border-radius:16px;padding:22px 12px;color:#fff;font-size:22px;font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.25);text-align:center}
  .card small{display:block;font-size:12px;font-weight:normal;margin-top:6px;opacity:.9}
  .crs{display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:16px;margin-bottom:10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:19px;font-weight:bold;border-left:10px solid var(--c)}
  .crs small{display:block;font-weight:normal;font-size:13px;color:#555;margin-top:5px}
  .crs.off{background:#e6e2d8;color:#888;box-shadow:none}
  .crs.off small{color:#888}
  .warn{color:#e65100}
  .note{font-size:12px;color:#777;margin:18px 4px 0;line-height:1.6}
  #v2{display:none}
  .adminbtn{display:none}
  @media (min-width:900px) and (hover:hover) and (pointer:fine){ .adminbtn{display:inline-block} }
  #menu{display:none;position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 59px);z-index:1070;background:#fff;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.4);padding:8px;min-width:220px;color:#222}
  #menu.open{display:block}
  #menu .mh{font-size:12px;color:#777;padding:6px 8px 2px}
  #menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 10px;font-size:16px;border-radius:8px;color:#222;font-weight:normal}
  #menu .ver{font-size:13px;color:#555;padding:8px 10px 4px;border-top:1px solid #e5e5e5;margin-top:4px}
</style>
</head>
<body>
<header><button id="back" style="display:none">◀ 戻る</button><b id="ttl">ごみ収集ナビ</b><button class="adminbtn" id="adm">⚙ 管理</button><button id="bMenu">☰ メニュー</button></header>
<div id="menu"></div>
<main>
  <div id="v1">
    <button class="allmap" id="allmap">🗺 全ステーションマップ<small>全コースのステーションを一枚の地図で見る／ピンのない場所を確認</small></button>
    <h2>可燃・ペット・ダンボール（色コース）</h2>
    <div class="grid" id="colors"></div>
    <h2>容プラ</h2>
    <div class="grid" id="youpura"></div>
    <p class="note">黒羽・湯津上地区は、準備中です。<br>「準備中」のコースは、マイマップのピンがそろい次第、順次追加します。</p>
  </div>
  <div id="v2"><div id="courses"></div></div>
</main>
<script>document.write('<script src="courses.js?t=' + Date.now() + '"><\/script>');</script>
<script src="ver.js"></script>
<script>
(function(){
  var L = COURSE_LIST;
  var COLORS = ['青','黄','黒','緑','紫','ピンク'], YOUPURA = ['容プラ(青)','容プラ(黄)','容プラ(紫)'];
  var colorOf = {}; L.forEach(function(c){ if (!colorOf[c.group]) colorOf[c.group] = c.color; });
  function isLight(c){ var r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16); return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.62; }
  function group(g){ return L.filter(function(c){ return c.group === g; }); }

  // ---- 色コースをタップしたとき、その日の車両番号を聞く（ごみ収集アプリと共通の保存場所。その色の全コースに入れる）----
  var d0 = new Date(), ymd = d0.getFullYear() + '-' + ('0' + (d0.getMonth() + 1)).slice(-2) + '-' + ('0' + d0.getDate()).slice(-2);
  var ADM = false; try { ADM = localStorage.getItem('gomi_admin_nav') === '1'; } catch(e) {}   // 裏モードのときだけ、ごみ収集アプリと連動
  function vk(id){ return ADM ? 'gomi_veh_' + id + '_' + ymd : 'gomi-map:veh:' + id + '_' + ymd; }
  var LASTV = ADM ? 'gomi_last_vehicle' : 'gomi-map:lastveh';
  function hasVeh(g){ return group(g).every(function(c){ try { return !!localStorage.getItem(vk(c.id)); } catch(e) { return false; } }); }
  function askVehTop(g, go){
    var init = ''; try { group(g).forEach(function(c){ if (!init) init = localStorage.getItem(vk(c.id)) || ''; }); if (!init) init = localStorage.getItem(LASTV) || ''; } catch(e) {}
    var ov = document.createElement('div'); ov.style.cssText = 'position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px';
    ov.innerHTML = '<div style="background:#fff;border-radius:14px;padding:18px;width:min(92vw,340px);box-shadow:0 4px 18px rgba(0,0,0,.4)"><p style="margin:0 0 10px;font-size:16px;font-weight:bold">車両番号を入力してください（数字4桁まで）</p><input id="vehIn" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" style="width:100%;font-size:24px;padding:10px;border:2px solid #90a4ae;border-radius:10px;box-sizing:border-box;text-align:center" value="' + init + '"><div id="vehMsg" style="color:#c62828;font-size:13px;min-height:18px;margin-top:6px"></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px"><button id="vehNo" style="border:0;background:#eee;border-radius:10px;padding:12px 16px;font-size:15px">キャンセル</button><button id="vehOk" style="border:0;background:#37474f;color:#fff;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:bold">決定</button></div></div>';
    document.body.appendChild(ov); var inp = ov.querySelector('#vehIn'); inp.focus(); inp.select();
    ov.querySelector('#vehNo').onclick = function(){ ov.remove(); };
    function ok(){
      var v = inp.value.trim(); if (!/^[0-9]{1,4}$/.test(v)) { ov.querySelector('#vehMsg').textContent = '車両番号は数字1〜4桁で入力してください'; return; }
      var p = ('0000' + v).slice(-4);
      try { group(g).forEach(function(c){ var k = vk(c.id); if (!localStorage.getItem(k)) localStorage.setItem(k, p); }); localStorage.setItem(LASTV, p); } catch(e) {}
      ov.remove(); go();
    }
    ov.querySelector('#vehOk').onclick = ok; inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') ok(); });
  }
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function cards(el, names){
    el.innerHTML = names.map(function(g){
      var cs = group(g), ok = cs.filter(function(c){ return c.avail; }).length;
      return '<button class="card" data-g="' + esc(g) + '" style="background:' + (colorOf[g] || '#777') + ';color:' + (isLight(colorOf[g] || '#777') ? '#222' : '#fff') + '">' + esc(g) + (g.indexOf('容プラ') === 0 ? '' : 'コース') + '<small>' + ok + '／' + cs.length + ' コース利用可</small></button>';
    }).join('');
  }
  cards(document.getElementById('colors'), COLORS);
  cards(document.getElementById('youpura'), YOUPURA);

  function showGroup(g){
    var cs = group(g);
    document.getElementById('v1').style.display = 'none'; document.getElementById('v2').style.display = 'block';
    document.getElementById('back').style.display = ''; document.getElementById('ttl').textContent = g + (g.indexOf('容プラ') === 0 ? '' : 'コース');
    document.getElementById('courses').innerHTML = cs.map(function(c){
      var miss = c.n - c.matched;
      if (!c.avail) return '<button class="crs off" disabled style="--c:' + c.color + '">' + esc(c.sched) + '<small>準備中（マイマップのピン待ち）／' + c.n + '件</small></button>';
      return '<button class="crs" data-id="' + esc(c.id) + '" style="--c:' + c.color + '">' + esc(c.sched) + '<small>' + c.matched + '件' + (miss > 0 ? '　<span class="warn">⚠ 位置未登録 ' + miss + '件（一覧に表示）</span>' : '') + '</small></button>';
    }).join('');
    window.scrollTo(0, 0);
  }
  function showTop(){
    document.getElementById('v1').style.display = 'block'; document.getElementById('v2').style.display = 'none';
    document.getElementById('back').style.display = 'none'; document.getElementById('ttl').textContent = 'ごみ収集ナビ';
  }
  function route(){ var m = decodeURIComponent(location.hash || '').match(/^#g=(.+)$/); if (m && group(m[1]).length) showGroup(m[1]); else showTop(); }

  document.addEventListener('click', function(e){
    var g = e.target.closest('[data-g]'); if (g) { var gn = g.getAttribute('data-g'), goG = function(){ location.hash = '#g=' + encodeURIComponent(gn); }; if (hasVeh(gn)) goG(); else askVehTop(gn, goG); return; }
    var c = e.target.closest('[data-id]'); if (c) { location.href = 'course.html?c=' + encodeURIComponent(c.getAttribute('data-id')); }
  });
  function openAdmin(){
    fetch('http://127.0.0.1:8790/api/job', {mode:'no-cors'}).then(function(){ window.open('http://127.0.0.1:8790/', '_blank'); })
      .catch(function(){ alert('管理ツールが起動していません。\n\n事務所PCで、作業フォルダの「ステーション地図 管理ツール」をダブルクリックして起動してから、もう一度押してください。\n（スマホ・タブレットでは使えません）'); });
  }
  document.getElementById('adm').onclick = openAdmin;
  function renderAppMenu(){
    var el = document.getElementById('menu');
    el.innerHTML = '<button data-act="top">🏠 トップに戻る</button><button data-act="upd">🔄 最新版に更新</button><div class="ver">バージョン ' + (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '-') + '</div>';
  }
  document.getElementById('bMenu').onclick = function(e){ e.stopPropagation(); var el = document.getElementById('menu'); if (el.classList.contains('open')) el.classList.remove('open'); else { renderAppMenu(); el.classList.add('open'); } };
  document.getElementById('menu').onclick = function(e){
    var b = e.target.closest('button'); if (!b) return; var a = b.getAttribute('data-act');
    this.classList.remove('open');
    if (a === 'top') { if (location.hash) { location.hash = ''; } window.scrollTo(0, 0); }
    else if (a === 'upd') { appForceUpdate(); }
  };
  document.addEventListener('click', function(e){ if (!e.target.closest('#menu') && !e.target.closest('#bMenu')) document.getElementById('menu').classList.remove('open'); });

  document.getElementById('allmap').onclick = function(){ location.href = 'all.html'; };
  document.getElementById('back').onclick = function(){ location.hash = ''; };
  window.addEventListener('hashchange', route);

  route();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
