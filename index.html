<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ステーション地図">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7b1fa2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ステーション地図</title>
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:#fff;-webkit-text-size-adjust:100%}
  #hd{position:absolute;top:0;left:0;right:0;z-index:1000;background:#7b1fa2;color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:8px}
  #hd b{flex:1;font-size:15px}
  #hd button{background:#fff;color:#7b1fa2;border:0;border-radius:16px;padding:6px 12px;font-size:14px;font-weight:bold}
  #map{position:absolute;top:0;bottom:0;left:0;right:0}
  .leaflet-top{margin-top:calc(env(safe-area-inset-top) + 50px)}
  .leaflet-container{background:#faeee0}   /* 地図の背景（薄い肌色） */
  .leaflet-tile-pane,.maplibregl-canvas{filter:grayscale(1) contrast(.9) brightness(1.08)}
  .maplibregl-canvas{position:absolute;left:0;top:0}
  .leaflet-maplibre-gl-container{pointer-events:none}
  .poi{position:relative;white-space:nowrap;line-height:18px}
  .poi .pi{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--c);box-sizing:border-box;font-size:10px;vertical-align:middle}
  .poi .pn{display:none;margin-left:4px;font-size:11px;font-weight:bold;color:var(--c);vertical-align:middle;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 3px #fff}
  .z-poi .poi .pn{display:inline}
  .dot{width:10px;height:10px;border-radius:50%;background:#7b1fa2;border:1px solid #fff;opacity:.6}
  .dot.done{background:#aaa;opacity:.5}
  .lbl.now{display:block}
  .pin{background:#7b1fa2;color:#fff;border:2px solid #fff;border-radius:50%;width:28px;height:28px;line-height:24px;text-align:center;font-size:12px;font-weight:bold;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .pin.done{background:#b9a3c4;opacity:.7}
  .pin.sel{background:#e65100;transform:scale(1.35)}
  .z-small .pin{transform:scale(.72)}
  .z-small .pin.sel{transform:scale(1.1)}
  .lbl{display:none;background:none;border:0;box-shadow:none;color:#222;font-weight:bold;font-size:12px;padding:0;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff}
  .lbl:before{display:none}
  .z-label .lbl{display:block}
  .co{background:#263238;color:#fff;border:2px solid #fff;border-radius:6px;width:36px;height:22px;line-height:22px;text-align:center;font-size:12px;font-weight:bold;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .co.sel{background:#e65100;transform:scale(1.2)}
  .me{width:16px;height:16px;background:#1a73e8;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(26,115,232,.4)}
  #fab{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 190px);z-index:1000;display:flex;flex-direction:column;gap:10px}
  #fab button{width:48px;height:48px;border-radius:50%;border:0;background:#fff;color:#7b1fa2;font-size:11px;font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  #fab button.on{background:#7b1fa2;color:#fff}
  #card{position:absolute;left:0;right:0;bottom:0;z-index:1050;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.35);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px)}
  #card .c1{display:flex;gap:10px;align-items:center}
  #card .n{background:#e65100;color:#fff;border-radius:10px;min-width:54px;height:44px;line-height:44px;text-align:center;font-size:20px;font-weight:bold;padding:0 6px}
  #card .t{flex:1;font-size:15px;line-height:1.35}
  #card small{color:#666;font-size:12px}
  #card .c2{display:flex;gap:8px;margin-top:8px}
  #card button,#card a.g{border:0;border-radius:10px;font-size:15px;padding:12px 10px;font-weight:bold;text-align:center;text-decoration:none}
  #card .c2 .steps{background:#ede7f6;color:#4a148c;flex:1}
  #card .c2 .go{background:#7b1fa2;color:#fff;flex:2;font-size:17px}
  #card .c3{display:flex;gap:8px;margin-top:6px}
  #card .c3 .back{background:#eee;color:#333;flex:1;padding:8px}
  #card .c3 a.g{background:#eee;color:#333;flex:1;padding:8px}
  #rng{display:none;position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom) + 250px);z-index:1060;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.4);padding:10px 12px;font-size:14px;line-height:2}
  #rng input{width:56px;font-size:16px;padding:4px;border:1px solid #bbb;border-radius:6px;text-align:center}
  #rng button{border:0;border-radius:8px;padding:8px 12px;margin-right:6px;font-size:14px;font-weight:bold;background:#ede7f6;color:#4a148c}
  #rng #rShow{background:#1a237e;color:#fff}
  #steps{position:absolute;left:0;right:0;bottom:178px;max-height:38%;overflow:auto;z-index:1040;background:#fff;box-shadow:0 -2px 8px rgba(0,0,0,.3);display:none;padding:6px 12px;font-size:15px}
  #steps.open{display:block}
  #steps div{padding:7px 0;border-bottom:1px solid #eee}
  #steps b{color:#e65100}
  #sheet{position:absolute;left:0;right:0;bottom:0;top:25%;z-index:1100;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.4);display:none;flex-direction:column}
  #sheet.open{display:flex}
  #sheet .top{padding:10px 12px;display:flex;gap:8px;border-bottom:1px solid #ddd}
  #sheet input{flex:1;font-size:16px;padding:6px 8px;border:1px solid #bbb;border-radius:6px}
  #sheet .top button{border:0;background:#eee;border-radius:6px;padding:0 12px;font-size:14px}
  #list{overflow:auto;flex:1}
  .row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #eee;font-size:15px}
  .row.done{opacity:.45}
  .row .n{background:#7b1fa2;color:#fff;border-radius:50%;min-width:28px;height:28px;line-height:28px;text-align:center;font-size:12px;font-weight:bold}
  .row small{color:#777}
  .pop a{display:inline-block;margin:4px 6px 0 0;padding:6px 10px;background:#7b1fa2;color:#fff;border-radius:6px;text-decoration:none;font-size:13px}
  .pop a.main{background:#e65100;font-weight:bold;font-size:14px}
  .pop a.sub{background:#777}
  #toast{display:none;position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 60px);z-index:1200;background:rgba(0,0,0,.8);color:#fff;padding:8px 14px;border-radius:16px;font-size:13px;max-width:80%;text-align:center}
</style>
</head>
<body>
<div id="hd"><b id="title">ステーション地図</b><button id="bList">一覧</button></div>
<div id="map"></div>
<div id="toast"></div>
<div id="fab"><button id="bLoc">現在地</button><button id="bLine">順路</button><button id="bAll">全ピン</button></div>
<div id="rng"><b>順路を表示</b><br>№ <input id="rFrom" type="number" min="1" inputmode="numeric"> から № <input id="rTo" type="number" min="1" inputmode="numeric"> まで<br>
  <button id="rShow">表示</button><button id="rAll">全体</button><button id="rOff">消す</button></div>
<div id="steps"></div>
<div id="card"></div>
<div id="sheet"><div class="top"><input id="q" type="search" placeholder="番号・ST№・目標物で検索"><button id="bClose">閉じる</button></div><div id="list"></div></div>

<script src="lib/leaflet.js"></script>
<script src="lib/maplibre-gl.js"></script>
<script src="lib/leaflet-maplibre-gl.js"></script>
<script src="simple-style.js"></script>
<script src="data.js"></script>
<script src="route.js"></script>
<script src="poi.js"></script>
<script src="legs.js"></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var cid = params.get('course') || Object.keys(COURSES)[0];
  var C = COURSES[cid], S = C.stations, LG = (typeof LEGS !== 'undefined' && LEGS[cid]) ? LEGS[cid] : null;
  var CP = [COMPANY.lat, COMPANY.lng];

  // ---- 進み具合（その日の分をスマホに保存）----
  var d0 = new Date(), ymd = d0.getFullYear() + '-' + ('0'+(d0.getMonth()+1)).slice(-2) + '-' + ('0'+d0.getDate()).slice(-2);
  var KEY = 'gomi-map:' + cid + ':' + ymd, done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(done)); } catch(e) {} }
  function firstNotDone(){ for (var i = 0; i < S.length; i++) if (!done[S[i].no]) return i; return S.length; }
  var cur = firstNotDone();   // 次に向かう位置（0〜S.length。S.lengthは会社へ戻る）
  var prevIdx = cur - 1;      // 直前に完了した位置（-1は会社から）。cur-1 と違うときは「順番どおりでない移動」

  // ---- 地図 ----
  var map = L.map('map', {zoomControl:false}); window.gomiMap = map;
  var attr = '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>';
  var pale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {maxZoom:18, attribution:attr});
  // 記号・文字なしのシンプル地図（道路・川・水面・鉄道のみ）。使えない端末では「見やすい地図」に自動で切り替え
  var simple = null;
  try {
    if (typeof L.maplibreGL === 'function' && typeof SIMPLE_STYLE !== 'undefined') {
      var sty = JSON.parse(JSON.stringify(SIMPLE_STYLE));
      sty.layers = sty.layers.filter(function(l){ return l.type !== 'background'; });   // 背景は透明にして、下の肌色（.leaflet-container）を見せる
      simple = L.maplibreGL({style: sty, attribution: attr});
    }
  } catch(e) { simple = null; }
  (simple || pale).addTo(map);
  var std = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {maxZoom:18, attribution:attr});
  var photo = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {maxZoom:18, attribution:attr});
  var bases = {}; if (simple) bases['シンプル（記号なし）'] = simple;
  bases['見やすい地図'] = pale; bases['標準の地図'] = std; bases['航空写真'] = photo;
  L.control.layers(bases, null, {position:'topright'}).addTo(map);
  // 拡大率に応じて、ピンを小さく／目標物の名前を表示
  var poiLayer = L.layerGroup();   // コンビニ・学校・お店などの目標物（拡大したときだけ表示）
  function zoomClass(){
    var z = map.getZoom(), c = map.getContainer().classList; c.toggle('z-small', z < 15); c.toggle('z-label', z >= 16); c.toggle('z-poi', z >= 16);
    if (z >= 15) { if (!map.hasLayer(poiLayer)) poiLayer.addTo(map); } else if (map.hasLayer(poiLayer)) map.removeLayer(poiLayer);
  }
  map.attributionControl.addAttribution('目標物 © OpenStreetMap contributors');
  map.on('zoomend', zoomClass);

  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtD(m){ return m >= 1000 ? (m/1000).toFixed(1) + 'km' : Math.round(m) + 'm'; }
  function toast(t, ms){ var d = document.getElementById('toast'); d.textContent = t; d.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function(){ d.style.display = 'none'; }, ms || 3500); }
  function gdir(a, b){ return 'https://www.google.com/maps/dir/?api=1&origin=' + a[0] + ',' + a[1] + '&destination=' + b[0] + ',' + b[1] + '&travelmode=driving'; }
  function pos(i){ return i < 0 ? CP : (i >= S.length ? CP : [S[i].lat, S[i].lng]); }

  var markers = {}, allLL = [];
  function pinIcon(no, cls){
    if (cls && cls.indexOf('dot') >= 0) return L.divIcon({className:'', html:'<div class="'+cls+'"></div>', iconSize:[12,12], iconAnchor:[6,6]});
    return L.divIcon({className:'', html:'<div class="pin'+(cls?' '+cls:'')+'">'+no+'</div>', iconSize:[28,28], iconAnchor:[14,14]});
  }
  var showAll = true;    // true: 全ピンを番号付きで表示（「全ピン」ボタンで、次の5件だけ番号付きにも切り替え可）
  S.forEach(function(s, idx){
    var p = [s.lat, s.lng]; allLL.push(p);
    var m = L.marker(p, {icon: pinIcon(s.no, '')}).addTo(map);
    var g = 'https://www.google.com/maps/search/?api=1&query=' + s.lat + ',' + s.lng;
    m.bindPopup('<div class="pop"><b>№' + s.no + '</b>　ST№' + s.st + '<br>地図: ' + s.map + '<br>' + esc(s.mark) +
      '<br><a class="main" href="#" data-idx="' + idx + '">ここを次にする</a><a class="sub" href="' + g + '" target="_blank">Googleマップで開く</a></div>');
    markers[idx] = m;
  });
  // 目標物（コンビニ・学校・お店など）
  var POI_STYLE = {cv:['🏪','#1e88e5'], sm:['🛒','#1e88e5'], sc:['🏫','#f9a825'], hp:['🏥','#e53935'], po:['📮','#e53935'], fu:['⛽','#6d4c41'], bk:['🏦','#546e7a'],
    fd:['🍴','#fb8c00'], dr:['💊','#43a047'], cc:['🏛','#7e57c2'], wp:['⛩','#8e24aa'], pk:['🌳','#43a047'], sh:['🛍','#1e88e5'], tr:['📷','#00897b'], of:['🏢','#546e7a']};
  if (typeof POIS !== 'undefined') POIS.forEach(function(p){
    var st = POI_STYLE[p.c] || ['•','#777'];
    L.marker([p.lat, p.lng], {icon:L.divIcon({className:'', html:'<div class="poi" style="--c:' + st[1] + '"><span class="pi">' + st[0] + '</span><span class="pn">' + esc(p.n) + '</span></div>', iconSize:[18,18], iconAnchor:[9,9]}), interactive:false, keyboard:false, zIndexOffset:-500}).addTo(poiLayer);
  });
  var cm = L.marker(CP, {icon:L.divIcon({className:'', html:'<div class="co" id="coIcon">会社</div>', iconSize:[40,26], iconAnchor:[20,13]}), zIndexOffset:1000}).addTo(map);
  cm.bindPopup('<div class="pop"><b>' + COMPANY.name + '</b><br>' + COMPANY.address + '<br><a class="main" href="#" data-idx="' + S.length + '">会社へ戻る</a></div>');
  map.fitBounds(allLL.concat([CP]), {padding:[40,40]});
  zoomClass();

  map.on('popupopen', function(e){
    var a = e.popup.getElement().querySelector('a[data-idx]');
    if (a) a.onclick = function(ev){ ev.preventDefault(); cur = +a.getAttribute('data-idx'); map.closePopup(); render(true); };
  });

  // ---- 全体の順路（会社→№1〜№104→会社）----
  var R = (typeof ROUTES !== 'undefined') ? ROUTES[cid] : null;
  var allLine = L.polyline(R ? R.line : allLL, {color:C.color, weight:4, opacity:.6});
  var bLine = document.getElementById('bLine'), rng = document.getElementById('rng');
  var rFrom = document.getElementById('rFrom'), rTo = document.getElementById('rTo'), rangeLine = null;
  bLine.onclick = function(){
    if (rng.style.display === 'block') { rng.style.display = 'none'; return; }
    rFrom.max = rTo.max = S.length;
    rFrom.value = Math.min(cur + 1, S.length - 1); rTo.value = Math.min(+rFrom.value + 4, S.length);
    rng.style.display = 'block';
  };
  function clearRange(){ if (rangeLine) { map.removeLayer(rangeLine); rangeLine = null; } if (map.hasLayer(allLine)) map.removeLayer(allLine); bLine.classList.remove('on'); }
  // №a〜№b の順路（区間データをつなぐ。№kから№k+1 は LG[k]）
  document.getElementById('rShow').onclick = function(){
    var a = Math.max(1, parseInt(rFrom.value, 10) || 1), b = Math.min(S.length, parseInt(rTo.value, 10) || S.length);
    if (!LG) { toast('区間データがありません'); return; }
    if (a >= b) { toast('終了は開始より大きい番号にしてください'); return; }
    clearRange();
    var pts = [], km = 0, mn = 0;
    for (var k = a; k <= b - 1; k++) { pts = pts.concat(LG[k].l); km += LG[k].km; mn += LG[k].min; }
    rangeLine = L.featureGroup([L.polyline(pts, {color:'#fff', weight:12, opacity:.95}), L.polyline(pts, {color:'#00897b', weight:7, opacity:1})]).addTo(map);
    bLine.classList.add('on');
    map.fitBounds(rangeLine.getBounds(), {paddingTopLeft:[30,110], paddingBottomRight:[30,260], maxZoom:17});
    toast('№' + a + '→№' + b + '　約' + km.toFixed(1) + 'km・走行のみ約' + mn + '分');
    rng.style.display = 'none';
  };
  document.getElementById('rAll').onclick = function(){
    clearRange(); allLine.addTo(map); bLine.classList.add('on'); rng.style.display = 'none';
    map.fitBounds(allLL.concat([CP]), {padding:[40,40]}); if (R) toast('全体（会社→№1〜№' + S.length + '→会社）約' + R.km + 'km');
  };
  document.getElementById('rOff').onclick = function(){ clearRange(); rng.style.display = 'none'; };

  // ---- 区間（前→次）の案内線 ----
  var legLine = null, lastPos = null, following = false;
  function render(fit){
    // ピンの色
    S.forEach(function(s, i){
      var focus = showAll || (i >= cur && i <= cur + 4);
      var cls = i === cur ? 'sel' : (done[s.no] ? (showAll ? 'done' : 'dot done') : (focus ? '' : 'dot'));
      markers[i].setIcon(pinIcon(s.no, cls));
      markers[i].setZIndexOffset(i === cur ? 800 : (focus ? 200 : 0));
      markers[i].unbindTooltip();
      // 目標物の名前：今向かう場所は常に表示、ほかのピンは拡大したとき（z-label）に表示
      if ((i === cur || focus) && s.mark) markers[i].bindTooltip(esc(s.mark), {permanent:true, direction:'right', offset:[16,0], className: i === cur ? 'lbl now' : 'lbl'});
    });
    var ci = document.getElementById('coIcon'); if (ci) ci.className = 'co' + (cur >= S.length ? ' sel' : '');
    var nDone = S.filter(function(s){ return done[s.no]; }).length;
    document.getElementById('title').textContent = C.name + '　' + nDone + '/' + S.length + '完了';

    // 案内線
    if (legLine) { map.removeLayer(legLine); legLine = null; }
    var seq = (prevIdx === cur - 1);                 // 順番どおりの移動か
    var leg = (LG && seq) ? LG[cur] : null;           // 順番どおりのときだけ道順データがある
    var from = pos(prevIdx), to = pos(cur);
    if (leg) legLine = L.featureGroup([L.polyline(leg.l, {color:'#fff', weight:13, opacity:.95}), L.polyline(leg.l, {color:'#2f3fe0', weight:8, opacity:1})]).addTo(map);
    else legLine = L.featureGroup([L.polyline([from, to], {color:'#2f3fe0', weight:5, dashArray:'8,8'})]).addTo(map);
    if (fit && !following) { var b = legLine.getBounds(); if (lastPos) b.extend(lastPos); map.fitBounds(b, {paddingTopLeft:[30,70], paddingBottomRight:[30,260], maxZoom:17}); }

    // カード
    var s = cur < S.length ? S[cur] : null, fin = cur >= S.length;
    var prevName = prevIdx < 0 ? '会社' : '№' + S[prevIdx].no;
    var allDone = fin && S.length && done[S[S.length-1].no];
    var title = fin ? '会社' : '№' + s.no;
    var main = fin ? (COMPANY.address) : ('ST' + s.st + '　' + esc(s.mark));
    var sub = (fin ? '№' + S[S.length-1].no : prevName) + (fin ? '' : '') + 'から';
    var legInfo = leg ? ('　' + leg.km + 'km・約' + leg.min + '分') : ('　直線 約' + fmtD(hav(from, to)) + '（順番どおりでないため道順データなし。点線は直線です）');
    var gHref = seq ? gdir(from, to) : ('https://www.google.com/maps/dir/?api=1&destination=' + to[0] + ',' + to[1] + '&travelmode=driving');
    document.getElementById('card').innerHTML =
      '<div class="c1"><div class="n">' + title + '</div><div class="t"><b>' + (fin ? '最後は会社へ戻ります' : main) + '</b><br><small>' +
      (fin ? esc(main) : '地図 ' + esc(s.map)) + '<br>' + prevName + 'から' + legInfo +
      '<span id="gd"></span></small></div></div>' +
      '<div class="c2"><button class="steps" id="bSteps">曲がり方</button><button class="go" id="bDone">' + (fin ? '帰社しました' : '完了 → 次へ') + '</button></div>' +
      '<div class="c3"><button class="back" id="bBack">1つ戻る</button><a class="g" target="_blank" href="' + gHref + '">Googleマップで案内' + (seq ? '' : '（現在地から）') + '</a></div>';
    document.getElementById('bDone').onclick = onDone;
    document.getElementById('bBack').onclick = onBack;
    document.getElementById('bSteps').onclick = toggleSteps;
    buildSteps(leg);
    updateDist();
  }
  function onDone(){
    if (cur < S.length) { done[S[cur].no] = true; save(); prevIdx = cur; cur = cur + 1; render(true); }
    else { toast('お疲れさまでした。本日のコースは完了です'); }
  }
  function onBack(){
    if (cur <= 0) return;
    cur = cur - 1; if (cur < S.length) delete done[S[cur].no]; prevIdx = cur - 1; save(); render(true);
  }

  // ---- 曲がり方リスト ----
  var stepsEl = document.getElementById('steps');
  function buildSteps(leg){
    if (!leg) { stepsEl.innerHTML = '<div>この区間の案内データはありません</div>'; return; }
    stepsEl.innerHTML = leg.s.map(function(st, i){
      return '<div><b>' + (i+1) + '.</b> ' + esc(st.t) + (st.d > 0 ? '　→ ' + fmtD(st.d) + '進む' : '') + '</div>';
    }).join('');
  }
  function toggleSteps(){ stepsEl.classList.toggle('open'); }

  // ---- 現在地 ----
  var me = null, watching = false, bLoc = document.getElementById('bLoc');
  function hav(a, b){ var R2 = 6371000, r = Math.PI/180, dLa = (b[0]-a[0])*r, dLo = (b[1]-a[1])*r;
    var x = Math.sin(dLa/2)*Math.sin(dLa/2) + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)*Math.sin(dLo/2); return 2*R2*Math.asin(Math.sqrt(x)); }
  function updateDist(){ var el = document.getElementById('gd'); if (!el) return; el.textContent = lastPos ? '　／　現在地から約' + fmtD(hav(lastPos, pos(cur))) : ''; }
  // 自動追従：青い点に合わせて地図が動く。地図を指で動かすと一時停止し、「現在地」ボタンで再開
  function setFollow(on){ following = on; bLoc.classList.toggle('on', on); bLoc.textContent = on ? '追従中' : '現在地'; }
  map.on('dragstart', function(){ if (following) { setFollow(false); toast('追従を一時停止しました。「現在地」で再開します'); } });

  // 画面を消さない設定（Wake Lock）。対応していない端末では何もしない
  var wake = null;
  function keepAwake(){
    try {
      if (!('wakeLock' in navigator)) { return false; }
      navigator.wakeLock.request('screen').then(function(l){ wake = l; l.addEventListener('release', function(){ wake = null; }); }).catch(function(){});
      return true;
    } catch(e) { return false; }
  }
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && watching && !wake) keepAwake(); });

  bLoc.onclick = function(){
    if (!navigator.geolocation) { toast('この端末では現在地を取得できません'); return; }
    if (watching && me) { setFollow(true); map.setView(me.getLatLng(), Math.max(map.getZoom(), 16)); return; }
    navigator.geolocation.watchPosition(function(p){
      lastPos = [p.coords.latitude, p.coords.longitude];
      if (!me) {
        me = L.marker(lastPos, {icon:L.divIcon({className:'', html:'<div class="me"></div>', iconSize:[16,16], iconAnchor:[8,8]}), interactive:false}).addTo(map);
        map.setView(lastPos, 16); setFollow(true);
        if (!keepAwake()) toast('この端末では「画面を消さない設定」は使えません。画面を点けたままにしてください');
      } else {
        me.setLatLng(lastPos);
        if (following) map.panTo(lastPos, {animate:true, duration:0.5});
      }
      watching = true; updateDist();
    }, function(err){
      if (me) return;   // 追跡が始まったあとの一時的な途切れでは、案内を出さない
      var ua = navigator.userAgent, inApp = /Line\/|FBAN|FBAV|Instagram|GSA\/|Gmail|wv\)/i.test(ua);
      var msg;
      if (!window.isSecureContext) msg = 'HTTPSで開かれていないため、現在地を使えません';
      else if (err && err.code === 1) msg = inApp ? 'メール等のアプリ内ブラウザでは位置情報を使えません。SafariまたはChromeで開き直してください'
        : '位置情報が許可されていません。端末の設定で、このブラウザの位置情報を「許可」にしてください';
      else if (err && err.code === 2) msg = '位置を取得できません。端末の「位置情報サービス」がオンか、電波の状態をご確認ください';
      else if (err && err.code === 3) msg = '位置の取得に時間がかかっています。屋外で、もう一度お試しください';
      else msg = '現在地を取得できませんでした';
      toast(msg, 10000);
    }, {enableHighAccuracy:true, timeout:20000, maximumAge:5000});
  };
  var bAll = document.getElementById('bAll'); bAll.classList.toggle('on', showAll);
  bAll.onclick = function(){ showAll = !showAll; bAll.classList.toggle('on', showAll); render(false); toast(showAll ? '全ピンを番号つきで表示' : '次の5件だけ番号つきで表示'); };

  // ---- 一覧 ----
  var sheet = document.getElementById('sheet'), list = document.getElementById('list'), q = document.getElementById('q');
  function renderList(){
    var t = q.value.trim().toLowerCase();
    list.innerHTML = S.map(function(s, i){ return {s:s, i:i}; }).filter(function(o){ var s = o.s; return !t || (s.no+' '+s.st+' '+s.map+' '+s.mark).toLowerCase().indexOf(t) >= 0; }).map(function(o){
      var s = o.s; return '<div class="row' + (done[s.no] ? ' done' : '') + '" data-idx="' + o.i + '"><span class="n">' + s.no + '</span><div>ST' + s.st + '　' + esc(s.mark) + '<br><small>地図 ' + s.map + (done[s.no] ? '　✓完了' : '') + '</small></div></div>';
    }).join('');
  }
  list.onclick = function(e){
    var row = e.target.closest('.row'); if (!row) return;
    var i = +row.dataset.idx; sheet.classList.remove('open'); map.setView(pos(i), 17); markers[i].openPopup();
  };
  q.oninput = renderList;
  document.getElementById('bList').onclick = function(){ renderList(); sheet.classList.add('open'); };
  document.getElementById('bClose').onclick = function(){ sheet.classList.remove('open'); };

  render(true);
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
